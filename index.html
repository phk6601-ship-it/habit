<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#22262b; --sub:#6b7178; --line:#e4e0d8;
  --main:#2f6f5e; --main-soft:#e3efea; --warn:#c9771c; --warn-soft:#fbefdc;
  --bad:#c0463a; --bad-soft:#fbe4e1; --ok:#2f8a4e; --ok-soft:#e1f2e6;
  --good:#3d8bd4; --good-soft:#e3effa; --mid:#8a8f96; --mid-soft:#eeeeec;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}

.hidden{display:none!important}

/* ---------- 학생 화면 ---------- */
.stu{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
.stu-card{width:100%;max-width:640px;background:var(--card);border-radius:22px;padding:28px 26px;border:1px solid var(--line)}

.pill.late{background:var(--warn-soft);color:#8a4f0c}
.big-name{font-size:34px;font-weight:700;margin:22px 0 4px}
.hello{font-size:19px;color:var(--sub);margin:0 0 26px}

.rules h4{margin:0 0 8px;font-size:14px;color:var(--bad)}

.mood .em{font-size:38px;line-height:1}
.mood .tx{font-size:15px;font-weight:600}
.mood.on{border-color:var(--main);background:var(--main-soft)}
.talk{margin-top:16px;width:100%;border:2px dashed var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;color:var(--sub)}
.talk.on{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:#7a4a0e;font-weight:700}
.private{font-size:13px;color:var(--sub);text-align:center;margin:10px 0 18px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.item .txt{flex:1;font-size:18px;font-weight:500}
.item .tag{font-size:12px;background:var(--warn-soft);color:#8a4f0c;border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:600;white-space:nowrap}
.yn{display:flex;gap:6px}
.yn button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--sub);min-width:72px}
.yn button.yes.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.yn button.no.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.item.done-yes{background:#fbfdfb}
.center{text-align:center}
.done-ic{font-size:64px;margin:20px 0 4px}
.done-t{font-size:30px;font-weight:800;margin:6px 0}
.done-s{font-size:22px;color:var(--main);font-weight:700;margin:6px 0 24px}
.next{font-size:15px;color:var(--sub)}
.lock-ic{font-size:52px;margin:18px 0 6px}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.numgrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;font-size:17px;font-weight:600}
.pin{width:100%;font-size:22px;letter-spacing:6px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0 12px}
.err{color:var(--bad);font-size:14px;min-height:18px}
.install{margin-top:14px;border:1px solid var(--main);background:#fff;color:var(--main);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600}
.tiny-link{background:none;border:none;color:#aab0b6;font-size:12px;margin-top:22px}

/* ---------- 선생님 화면 ---------- */
.t-wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
.t-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.t-head h1{font-size:22px;margin:0}
.t-head .date{color:var(--sub)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:15px}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}

.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}

.alert{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:15px}
.alert.a-talk{background:var(--warn-soft)}
.alert.a-hard{background:var(--bad-soft)}

table.tt{width:100%;border-collapse:collapse;font-size:14px}

.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--main)}

.form-grid{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;align-items:center}
.form-grid input[type=text],.form-grid input[type=date],.form-grid select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.days label{margin-right:10px;font-size:15px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.names input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-width:0}

.win input{padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.nums{display:flex;flex-wrap:wrap;gap:6px}

.achip.c-talk{color:#7a4a0e}

#toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:10px;max-width:360px}

.toast .tt-h{font-size:12px;color:var(--sub);font-weight:600}

.hscroll{overflow-x:auto;border:1px solid #f0ede7;border-radius:10px}
table.heat{border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}

table.heat tr:hover td{background:#f8faf9}
table.heat tr.sel td{background:#eaf4f0}
table.heat tr.foot td{color:var(--bad);font-weight:700;cursor:default;background:#fcfbf9}

td.hc.talkc i{outline:2px solid #e3a23d;outline-offset:0}
.h-good{background:#7fb3e6}.h-mid{background:#cfd2cf}.h-hard{background:#e0645a}.h-none{background:#f1efea}

td.hardn{color:var(--bad);font-weight:700}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:6px}
.dgrid h4{margin:6px 0 8px;font-size:15px}
.mbar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}

.mbar .mt i{display:block;height:100%;border-radius:6px}
.b-good{background:#7fb3e6}.b-mid{background:#b9bdb9}.b-hard{background:#e0645a}
.mbar .mc{width:44px;text-align:right;color:var(--sub)}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
/* ---------- TV ---------- */
.tv{min-height:100vh;padding:40px 56px;display:flex;flex-direction:column;gap:30px}
.tv-head{display:flex;justify-content:space-between;align-items:baseline}
.tv-head h1{font-size:44px;margin:0}
.tv-clock{font-size:40px;font-weight:700;color:var(--main)}
.tv-cards{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.tv-card{background:#fff;border-radius:28px;border:1px solid var(--line);padding:34px 40px}

.bar i{display:block;height:100%;background:var(--main);border-radius:9px}
.tv-rules{background:#fff;border-radius:28px;border:1px solid var(--line);padding:26px 40px}

@media (max-width:560px){.moods{grid-template-columns:repeat(4,1fr)}.mood .em{font-size:32px}.item .txt{font-size:16px}}
</style>

<script>
/* =========================================================
   1) Firebase 설정 — 여기에 붙여 넣으면 반 전체 연결
      (비워 두면 체험 모드: 이 브라우저에만 저장)
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAerNJ6VtC5GaVVEXhUtqKg4jviyHmK_qg",
  authDomain: "rushhour-classroom.firebaseapp.com",
  databaseURL: "https://rushhour-classroom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rushhour-classroom",
  storageBucket: "rushhour-classroom.firebasestorage.app",
  messagingSenderId: "81077293988",
  appId: "1:81077293988:web:066fae83d405fd71632731"
};   // 러시아워 교실과 같은 Firebase (습관 체크는 'habit-6-3' 폴더만 사용)
/* 예시)
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "...",
  databaseURL: "https://....firebasedatabase.app",
  projectId: "...",
  appId: "..."
};
*/
const ROOT = 'habit-6-3';   // Firebase 안에서 이 프로그램이 쓰는 폴더 이름

/* ---------- 기분 10개 ---------- */
const MOODS = [
  {k:'excited', t:'신나다',     e:'🤩', g:'good'},
  {k:'happy',   t:'행복하다',   e:'😊', g:'good'},
  {k:'calm',    t:'편안하다',   e:'😌', g:'mid'},
  {k:'soso',    t:'그냥 그래요', e:'😐', g:'mid'},
  {k:'tired',   t:'피곤하다',   e:'😪', g:'mid'},
  {k:'worried', t:'걱정되다',   e:'😟', g:'hard'},
  {k:'sad',     t:'속상하다',   e:'😢', g:'hard'},
  {k:'angry',   t:'화나다',     e:'😠', g:'hard'},
  {k:'unfair',  t:'억울하다',   e:'😤', g:'hard'},
  {k:'lonely',  t:'외롭다',     e:'🥺', g:'hard'},
];
const MOOD = Object.fromEntries(MOODS.map(m=>[m.k,m]));
const BLOCK_NAME = {morning:'아침', lunch:'점심'};
const DOW = ['일','월','화','수','목','금','토'];

/* ---------- 처음 설정값 ---------- */
const DEFAULT_CONFIG = {
  pin: '0000',
  classSize: 25,
  names: {},
  windows: {
    morning: {start:'08:00', end:'08:30', late:'08:40'},
    lunch:   {start:'12:50', end:'13:00', late:'13:05'}
  },
  rules: [
    '폰은 끄고 가방 안에 넣어요',
    '간식은 선생님이 준 것만 먹어요',
    '선생님 물건은 허락 없이 만지지 않아요'
  ],
  offDates: {},
  items: {
    m1:{text:'폰 끄고 가방에 넣었어요',            block:'morning', type:'daily',  order:1},
    m2:{text:'책상 위를 정리했어요',               block:'morning', type:'daily',  order:2},

    m5:{text:'안내장을 회수함에 냈어요',           block:'morning', type:'toggle', on:false, until:'', order:5},
    m6:{text:'과제를 제출했어요',                  block:'morning', type:'toggle', on:false, until:'', order:6},
    l1:{text:'줄 맞춰 이동했어요',                 block:'lunch',   type:'daily',  order:1},
    l2:{text:'선생님이 준 간식 외에는 먹지 않았어요', block:'lunch', type:'daily',  order:2},
    l3:{text:'책상 위를 정리했어요',               block:'lunch',   type:'daily',  order:3},
    l4:{text:'5교시 교과서를 꺼냈어요',            block:'lunch',   type:'daily',  order:4},
    l5:{text:'서랍과 사물함을 정리했어요',         block:'lunch',   type:'weekday', days:[5], order:5}
  }
};

/* =========================================================
   2) 저장소 (Firebase 또는 체험 모드)
   ========================================================= */
function clone(v){return v==null?null:JSON.parse(JSON.stringify(v))}
function splitPath(p){return String(p).split('/').filter(Boolean)}

const LocalStore = {
  key:'habit63_db', subs:new Set(),
  db(){try{return JSON.parse(localStorage.getItem(this.key))||{}}catch(e){return {}}},
  at(db,p){let c=db;for(const k of splitPath(p)){if(c==null||typeof c!=='object')return null;c=c[k]}return c===undefined?null:c},
  put(db,p,v){const ks=splitPath(p);let c=db;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=='object')c[ks[i]]={};c=c[ks[i]]}
    const last=ks[ks.length-1];if(v==null)delete c[last];else c[last]=clone(v)},
  save(db){localStorage.setItem(this.key,JSON.stringify(db));this.fire()},
  fire(){this.subs.forEach(h=>{try{h()}catch(e){console.error(e)}})},
  async get(p){return clone(this.at(this.db(),p))},
  async set(p,v){const db=this.db();this.put(db,p,v);this.save(db)},
  async update(p,obj){const db=this.db();for(const k in obj)this.put(db,p+'/'+k,obj[k]);this.save(db)},
  watch(p,cb){const h=()=>cb(clone(this.at(this.db(),p)));this.subs.add(h);h();return()=>this.subs.delete(h)},
  async recent(n){const r=this.at(this.db(),'records')||{};const out={};Object.keys(r).sort().slice(-n).forEach(k=>out[k]=r[k]);return clone(out)}
};
window.addEventListener('storage',e=>{if(e.key===LocalStore.key)LocalStore.fire()});

function makeFireStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();
  const ref=p=>db.ref(ROOT+'/'+p);
  return {
    async get(p){return (await ref(p).once('value')).val()},
    async set(p,v){return ref(p).set(v)},
    async update(p,obj){return ref(p).update(obj)},
    watch(p,cb){const r=ref(p);const h=s=>cb(s.val());r.on('value',h);return()=>r.off('value',h)},
    async recent(n){return (await ref('records').orderByKey().limitToLast(n).once('value')).val()||{}}
  };
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

const $app=document.getElementById('app');

const MODE=params.get('mode')||'student';
const TEST=params.get('test'); // test=morning | lunch  (시간 창 무시하고 열기)
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function dateStr(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hm(d=new Date()){return pad(d.getHours())+':'+pad(d.getMinutes())}
function niceDate(s){const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'}
function mergeConfig(c){
  const d=clone(DEFAULT_CONFIG); if(!c) return d;
  const out=Object.assign(d,c);
  out.windows=Object.assign(clone(DEFAULT_CONFIG.windows),c.windows||{});
  out.items=c.items||{}; out.offDates=c.offDates||{}; out.names=c.names||{};
  out.rules=Array.isArray(c.rules)?c.rules:(c.rules?Object.values(c.rules):d.rules);
  return out;
}
function nameOf(cfg,n){return (cfg.names&&cfg.names[n])||''}
function isOffDay(cfg,ds=dateStr()){const d=new Date(ds+'T00:00:00').getDay();return d===0||d===6||!!(cfg.offDates&&cfg.offDates[ds])}

/* 지금 열린 체크 시간 창 */
function currentWindow(cfg,now=new Date()){
  if(TEST&&BLOCK_NAME[TEST]) return {block:TEST,late:false};
  if(isOffDay(cfg)) return null;
  const t=hm(now);
  for(const b of ['morning','lunch']){
    const w=cfg.windows[b];
    if(t>=w.start&&t<w.end) return {block:b,late:false};
    if(t>=w.end&&t<w.late)  return {block:b,late:true};
  }
  return null;
}
function nextWindowText(cfg,now=new Date()){
  if(isOffDay(cfg)) return '오늘은 체크가 없는 날이에요';
  const t=hm(now);
  for(const b of ['morning','lunch']){const w=cfg.windows[b];if(t<w.start)return '다음 체크: '+BLOCK_NAME[b]+' '+w.start}
  return '오늘 체크는 모두 끝났어요';
}
/* 오늘 이 학생에게 보이는 항목 */
function itemsFor(cfg,block,num,ds=dateStr()){
  const dow=new Date(ds+'T00:00:00').getDay();
  return Object.entries(cfg.items||{}).map(([id,it])=>({id,...it}))
    .filter(it=>it.block===block)
    .filter(it=>{
      if(it.type==='daily') return true;
      if(it.type==='weekday') return (it.days||[]).map(Number).includes(dow);
      if(it.type==='toggle') return !!it.on && (!it.until||ds<=it.until);
      return false;
    })
    .filter(it=>{const who=String(it.who||'').trim();if(!who)return true;return who.split(/[ ,]+/).map(Number).includes(Number(num))})
    .sort((a,b)=>(a.order||0)-(b.order||0));
}

const T={cfg:null,today:{},recent:{},tab:'today',viewDate:dateStr(),viewNum:null,period:'20',hist:{},viewRec:{},

function ensureAudio(){try{if(!T.audio)T.audio=new (window.AudioContext||window.webkitAudioContext)();if(T.audio.state==='suspended')T.audio.resume()}catch(e){}}
function beep(){
  if(!T.audio) return;
  try{const a=T.audio,t=a.currentTime;[880,660,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+i*0.18);g.gain.exponentialRampToValueAtTime(0.3,t+i*0.18+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.18+0.16);
    o.connect(g).connect(a.destination);o.start(t+i*0.18);o.stop(t+i*0.18+0.17)})}catch(e){}
}

/* ----- 실시간 기분 알림 ----- */
function liveAlerts(day){
  const out=[];
  for(const b of ['morning','lunch']){
    const recs=(day&&day[b])||{};
    for(const n in recs){const r=recs[n];if(!r)continue;
      if(r.mood&&MOOD[r.mood]&&MOOD[r.mood].g==='hard') out.push({key:`${b}|${n}|mood|${r.mood}`,b,n:Number(n),type:'mood',val:r.mood,acked:!!(r.ack&&r.ack.mood===r.mood)});
      if(r.talk) out.push({key:`${b}|${n}|talk`,b,n:Number(n),type:'talk',val:true,acked:!!(r.ack&&r.ack.talk)});
    }
  }
  return out.sort((a,b)=>a.n-b.n||(a.b>b.b?-1:1));
}
function whoText(n){const nm=T.cfg?nameOf(T.cfg,n):'';return `${n}번${nm?' '+nm:''}`}
function alertText(a){return a.type==='talk'?`${whoText(a.n)} · 💬 이야기하고 싶어요 (${BLOCK_NAME[a.b]})`:`${whoText(a.n)} · ${MOOD[a.val].e} ${MOOD[a.val].t} (${BLOCK_NAME[a.b]})`}
function checkNewAlerts(){
  if(!T.cfg) return;
  const list=liveAlerts(T.today);
  let fresh=false;
  if(T.seen===null){T.seen=new Set(list.map(a=>a.key))}
  else list.filter(a=>!a.acked&&!T.seen.has(a.key)).forEach(a=>{T.seen.add(a.key);showToast(a);notify(a);fresh=true});
  if(fresh) beep();
  // 확인된 알림의 팝업은 닫기
  const ackd=new Set(list.filter(a=>a.acked).map(a=>a.key));
  document.querySelectorAll('#toasts .toast').forEach(el=>{if(ackd.has(el.dataset.key))el.remove()});
  renderAlertBar(list);
  const un=list.filter(a=>!a.acked).length;
  document.title=(un?`(${un}) `:'')+'우리반 습관 체크';
}
function showToast(a){
  const box=document.getElementById('toasts'); if(!box||box.querySelector(`[data-key="${a.key}"]`)) return;
  const el=document.createElement('div');el.className='toast '+(a.type==='talk'?'t-talk':'t-hard');el.dataset.key=a.key;
  el.innerHTML=`<div class="tt-h">${a.type==='talk'?'이야기 요청':'기분 알림'} · ${hm()}</div><div class="tt-b">${esc(alertText(a))}</div>
    <div class="row" style="margin-top:8px"><button class="btn pri" onclick="ackKey('${a.key}')">확인했어요</button><button class="btn" onclick="this.closest('.toast').remove()">닫기</button></div>`;
  box.prepend(el);
}
function notify(a){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{const nt=new Notification('우리반 기분 알림',{body:alertText(a),tag:a.key,requireInteraction:true,icon:'icon-192.png'});nt.onclick=()=>{window.focus();nt.close()}}catch(e){}
}
async function askNotify(){if('Notification' in window){await Notification.requestPermission();ensureAudio();checkNewAlerts()}}
async function ackKey(key){
  const [b,n,type,val]=key.split('|');
  await store.set(`records/${T.watchDate}/${b}/${n}/ack/${type}`,type==='talk'?true:val);
}
async function ackAll(){for(const a of liveAlerts(T.today).filter(a=>!a.acked)) await ackKey(a.key)}
function renderAlertBar(list){
  const bar=document.getElementById('tbar'); if(!bar) return;
  const un=list.filter(a=>!a.acked);
  const perm=('Notification' in window)?Notification.permission:'none';
  const tools=`${perm==='default'?'<button class="btn" onclick="askNotify()">🔔 PC 알림 켜기</button>':''}${perm==='denied'?'<span class="hint" style="margin:0">브라우저 알림이 차단돼 있어요 (팝업·소리는 됨)</span>':''}${!T.audio?'<span class="hint" style="margin:0">소리를 켜려면 화면을 한 번 눌러 주세요</span>':''}`;
  bar.innerHTML=un.length
    ?`<div class="abar on"><div class="abar-in"><b>🔔 확인 안 한 알림 ${un.length}건</b>
        <div class="achips">${un.map(a=>`<span class="achip ${a.type==='talk'?'c-talk':''}">${esc(alertText(a))}<button onclick="ackKey('${a.key}')">확인</button></span>`).join('')}</div>
        <div class="row">${un.length>1?'<button class="btn" onclick="ackAll()">모두 확인</button>':''}${tools}</div></div></div>`
    :`<div class="abar"><div class="abar-in"><span>✓ 확인 안 한 기분 알림이 없어요</span><div class="row">${tools}</div></div></div>`;
}

/* ----- 공통 표 ----- */
function moodChip(k){const m=MOOD[k];if(!m)return '';return `<span class="mchip g-${m.g}">${m.e} ${m.t}</span>`}
function statusChip(r,block,ds){

  return `<span class="st-chip s-ing">진행 중</span>`;
}
function missItems(r){
  if(!r||!r.checks) return [];
  return Object.entries(r.checks).filter(([,v])=>v==='no').map(([id])=>(r.itemText&&r.itemText[id])||(T.cfg.items[id]&&T.cfg.items[id].text)||id);
}
function missList(r){
  if(!r) return '';
  const mis=r.mismatch?Object.keys(r.mismatch).map(id=>'⚠ 체크 불일치: '+((r.itemText&&r.itemText[id])||id)):[];
  return [...missItems(r).map(x=>'✗ '+x),...mis].map(esc).join('<br>');
}
function dayTable(dayRec,ds){
  const size=Number(T.cfg.classSize)||25;
  let rows='';
  for(let n=1;n<=size;n++){
    const m=dayRec&&dayRec.morning&&dayRec.morning[n], l=dayRec&&dayRec.lunch&&dayRec.lunch[n];
    const talk=(m&&m.talk)||(l&&l.talk);
    rows+=`<tr><td>${n}</td><td>${esc(nameOf(T.cfg,n))} ${talk?'<span class="talkmark">💬</span>':''}</td>
      <td>${m?moodChip(m.mood):''}${statusChip(m,'morning',ds)}</td>
      <td>${l?moodChip(l.mood):''}${statusChip(l,'lunch',ds)}</td>
      <td class="miss">${[missList(m)&&'<b>아침</b> '+missList(m),missList(l)&&'<b>점심</b> '+missList(l)].filter(Boolean).join('<br>')}</td></tr>`;
  }
  return `<table class="tt"><thead><tr><th style="width:44px">번호</th><th style="width:130px">이름</th><th>아침 기분 · 상태</th><th>점심 기분 · 상태</th><th>못 한 항목</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function streakAlerts(){
  const ds=dateStr(), size=Number(T.cfg.classSize)||25, out=[];
  const rec=Object.assign({},T.recent||{}); rec[ds]=T.today||{};
  const dates=Object.keys(rec).filter(d=>d<=ds).sort();
  const g=k=>MOOD[k]?MOOD[k].g:null;
  for(let n=1;n<=size;n++){
    const days=dates.filter(d=>rec[d]&&((rec[d].morning&&rec[d].morning[n])||(rec[d].lunch&&rec[d].lunch[n]))).slice(-3);
    if(days.length<3) continue;
    if(days.every(d=>['morning','lunch'].some(b=>rec[d][b]&&rec[d][b][n]&&g(rec[d][b][n].mood)==='hard'))) out.push(`${whoText(n)} · 3일 연속 힘든 기분`);
    if(days.every(d=>rec[d].morning&&rec[d].morning[n]&&rec[d].morning[n].mood==='tired')) out.push(`${whoText(n)} · 3일 연속 아침에 피곤하다`);
  }
  return out;
}
function teacherShell(inner){
  T.rendered=true;
  const tabs=[['today','오늘'],['records','누적 기록'],['items','체크 항목'],['settings','설정']];
  return `<div class="t-wrap"><div class="t-head"><h1>우리반 습관 체크</h1><span class="date">${niceDate(dateStr())}</span>
    <div class="tabs">${tabs.map(([k,v])=>`<button class="${T.tab===k?'on':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div></div>${inner}</div>`;
}
function renderTeacher(){
  if(!T.cfg) return;
  if(T.tab==='today') return renderToday();
  if(T.tab==='items') return renderItems();
  if(T.tab==='records') return renderRecords();
  if(T.tab==='settings') return renderSettings();
}
function countDone(day,b){return day&&day[b]?Object.values(day[b]).filter(r=>r&&r.done).length:0}
function notDoneLine(ds,size){
  const out=[];
  for(const b of ['morning','lunch']){
    if(hm()<T.cfg.windows[b].start) continue;
    const list=[];for(let n=1;n<=size;n++){const r=T.today[b]&&T.today[b][n];if(!r||!r.done)list.push(n)}
    out.push(`<div class="alert a-tired"><b>${BLOCK_NAME[b]} 미완료</b><span>${list.length?list.map(n=>esc(whoText(n))).join(', '):'모두 완료!'}</span></div>`);
  }
  return out.join('');
}

const PERIODS=[['10','최근 10일'],['20','최근 20일'],['60','최근 60일'],['400','전체']];
async function loadHist(){

}
function gcls(r){return (!r||!r.mood||!MOOD[r.mood])?'h-none':'h-'+MOOD[r.mood].g}
function gtitle(d,b,r){return `${niceDate(d)} ${BLOCK_NAME[b]}: ${r&&MOOD[r.mood]?MOOD[r.mood].t:'기록 없음'}${r&&r.talk?' · 이야기 요청':''}`}
function studentStats(n,hist,dates){
  const s={rec:0,done:0,late:0,talk:0,hard:0,mood:{},miss:{}};
  dates.forEach(d=>['morning','lunch'].forEach(b=>{const r=hist[d]&&hist[d][b]&&hist[d][b][n];if(!r)return;
    s.rec++; if(r.done)s.done++; if(r.late)s.late++; if(r.talk)s.talk++;
    if(r.mood&&MOOD[r.mood]){s.mood[r.mood]=(s.mood[r.mood]||0)+1;if(MOOD[r.mood].g==='hard')s.hard++}
    missItems(r).forEach(t=>s.miss[t]=(s.miss[t]||0)+1);
  }));
  return s;
}

        <div class="stat"><div class="l">체크 완료</div><div class="v">${s.done}<small style="font-size:15px;color:#8a8f96"> / ${dates.length*2}회</small></div></div>
        <div class="stat"><div class="l">늦은 체크</div><div class="v">${s.late}회</div></div>
        <div class="stat"><div class="l">힘든 기분</div><div class="v" style="color:${s.hard?'var(--bad)':'inherit'}">${s.hard}회<small style="font-size:15px;color:#8a8f96"> ${s.rec?Math.round(s.hard/s.rec*100):0}%</small></div></div>

      <p class="hint">칸 하나 = 하루 (위: 아침, 아래: 점심). <span class="lg h-good"></span> 좋음 <span class="lg h-mid"></span> 보통 <span class="lg h-hard"></span> 힘듦 <span class="lg h-none"></span> 기록 없음 · 노란 테두리 = 이야기 요청 · 학생 줄을 누르면 자세히 보여요. (기록이 있는 날 기준)</p>

      <div style="margin-top:8px">${dayTable(T.viewRec||{},T.viewDate)}</div></div>`);

function exportCSV(){
  const hist=T.hist||{}, dates=Object.keys(hist).sort();
  if(!dates.length){alert('내려받을 기록이 없어요');return}
  const rows=[['날짜','요일','시간','번호','이름','기분','기분 묶음','이야기 요청','완료','완료 시각','늦음','못 한 항목','체크 불일치']];
  const gname={good:'좋음',mid:'보통',hard:'힘듦'};
  dates.forEach(d=>['morning','lunch'].forEach(b=>{
    const recs=(hist[d]&&hist[d][b])||{};
    Object.keys(recs).filter(n=>recs[n]).sort((a,c)=>a-c).forEach(n=>{const r=recs[n];const m=MOOD[r.mood];
      rows.push([d,DOW[new Date(d+'T00:00:00').getDay()],BLOCK_NAME[b],n,nameOf(T.cfg,n),m?m.t:'',m?gname[m.g]:'',r.talk?'O':'',r.done?'O':'',r.time||'',r.late?'O':'',missItems(r).join(' / '),r.mismatch?Object.keys(r.mismatch).map(id=>(r.itemText&&r.itemText[id])||id).join(' / '):''])});
  }));
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`습관체크_기록_${dates[0]}_${dates[dates.length-1]}.csv`;document.body.appendChild(a);a.click();a.remove();
}

function editItem(id){T.editId=id;renderItems()}
async function saveItem(){
  const text=document.getElementById('e-text').value.trim();
  if(!text){document.getElementById('e-err').textContent='문장을 입력하세요';return}
  const type=document.getElementById('e-type').value;
  const days=[...document.querySelectorAll('#e-days-row input:checked')].map(i=>Number(i.value));
  if(type==='weekday'&&!days.length){document.getElementById('e-err').textContent='요일을 하나 이상 고르세요';return}
  const block=document.getElementById('e-block').value;
  const id=T.editId==='new'?'i'+Date.now().toString(36):T.editId;
  const old=T.cfg.items[id]||{};
  const maxOrder=Math.max(0,...Object.values(T.cfg.items).filter(i=>i.block===block).map(i=>i.order||0));
  const it={text,block,type,who:document.getElementById('e-who').value.trim(),order:old.order&&old.block===block?old.order:maxOrder+1};
  if(type==='weekday') it.days=days;
  if(type==='toggle'){it.on=!!old.on;it.until=document.getElementById('e-until').value||''}
  await store.set('config/items/'+id,it);
  T.editId=null; T.cfg.items[id]=it; renderItems();
}
async function deleteItem(){
  if(!confirm('이 항목을 지울까요?'))return;
  await store.set('config/items/'+T.editId,null); delete T.cfg.items[T.editId]; T.editId=null; renderItems();
}
async function toggleItem(id){const it=T.cfg.items[id];it.on=!it.on;await store.set('config/items/'+id+'/on',it.on);renderItems()}
async function moveItem(id,dir){
  const it=T.cfg.items[id];
  const list=Object.entries(T.cfg.items).filter(([,x])=>x.block===it.block).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const i=list.findIndex(([k])=>k===id), j=i+dir; if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]];
  const upd={}; list.forEach(([k],idx)=>{upd[k+'/order']=idx+1;T.cfg.items[k].order=idx+1});
  await store.update('config/items',upd); renderItems();
}

/* ----- 설정 ----- */
function renderSettings(){
  const c=T.cfg, size=Number(c.classSize)||25;
  const offs=Object.keys(c.offDates||{}).filter(d=>c.offDates[d]).sort();
  $app.innerHTML=teacherShell(`
    <div class="panel"><h3>체크 시간</h3><p class="hint">열림 ~ 마감까지는 정상, 마감 ~ 늦은 체크 끝까지는 '늦음'으로 기록, 그 뒤엔 잠겨요. 주말은 자동으로 꺼져요.</p>
      <div class="win"><span></span><b style="font-size:13px">열림</b><b style="font-size:13px">마감</b><b style="font-size:13px">늦은 체크 끝</b>
      ${['morning','lunch'].map(b=>`<b>${BLOCK_NAME[b]}</b>${['start','end','late'].map(k=>`<input type="time" id="w-${b}-${k}" value="${c.windows[b][k]}">`).join('')}`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveWindows()">시간 저장</button><span class="hint" id="w-msg" style="margin:0"></span></div></div>
    <div class="panel"><h3>꼭 지키는 약속 (학생 첫 화면·TV에 매일 표시)</h3>
      ${[0,1,2,3].map(i=>`<input type="text" id="r-${i}" value="${esc(c.rules[i]||'')}" placeholder="비우면 표시 안 함" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px">`).join('')}
      <div class="row"><button class="btn pri" onclick="saveRules()">약속 저장</button><span class="hint" id="r-msg" style="margin:0"></span></div></div>
    <div class="panel"><h3>학생 이름</h3>
      <div class="row" style="margin-bottom:10px">학생 수 <input type="number" id="s-size" value="${size}" min="1" max="40" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="names">${Array.from({length:size},(_,i)=>i+1).map(n=>`<label>${n}<input type="text" id="n-${n}" value="${esc(nameOf(c,n))}"></label>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveNames()">이름 저장</button><span class="hint" id="n-msg" style="margin:0"></span></div></div>
    <div class="panel"><h3>체크 없는 날</h3><p class="hint">현장체험학습, 행사, 공휴일처럼 체크를 쉬는 날을 넣어 두세요.</p>
      <div class="row"><input type="date" id="o-date" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px"><button class="btn" onclick="addOff()">추가</button></div>
      <div class="row" style="margin-top:8px">${offs.map(d=>`<span class="badge" style="font-size:14px">${niceDate(d)} <a href="#" onclick="setOff('${d}',false).then(()=>renderSettings());return false" style="color:var(--bad);text-decoration:none">✕</a></span>`).join('')||'<span class="hint" style="margin:0">없음</span>'}</div></div>
    <div class="panel"><h3>비밀번호</h3><p class="hint">선생님 화면과 태블릿 번호 설정에 같이 쓰여요.</p>
      <div class="row"><input type="password" id="p-new" placeholder="새 비밀번호" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px"><button class="btn" onclick="savePin()">변경</button><span class="hint" id="p-msg" style="margin:0"></span></div></div>
    <div class="panel"><h3>주소 안내</h3><p class="hint" style="line-height:1.8">
      학생 태블릿: 이 주소 그대로 (처음 한 번 '태블릿 번호 설정')<br>
      선생님 화면: 주소 끝에 <b>?mode=teacher</b><br>
      교실 TV: 주소 끝에 <b>?mode=tv</b> (완료 숫자만 표시)</p></div>`);
}
const flash=(id,t)=>{const e=document.getElementById(id);if(e){e.textContent=t;setTimeout(()=>{if(e)e.textContent=''},2000)}};
async function saveWindows(){
  const w={};for(const b of ['morning','lunch']){w[b]={};for(const k of ['start','end','late'])w[b][k]=document.getElementById(`w-${b}-${k}`).value}
  for(const b in w){if(!(w[b].start<w[b].end&&w[b].end<=w[b].late)){flash('w-msg',BLOCK_NAME[b]+': 열림 < 마감 ≤ 늦은 체크 끝 순서로 넣어 주세요');return}}
  await store.set('config/windows',w);flash('w-msg','저장했어요');
}
async function saveRules(){const r=[0,1,2,3].map(i=>document.getElementById('r-'+i).value.trim()).filter(Boolean);await store.set('config/rules',r);flash('r-msg','저장했어요')}
async function saveNames(){
  const size=Math.max(1,Math.min(40,Number(document.getElementById('s-size').value)||25));
  const names={};for(let n=1;n<=Math.max(size,Number(T.cfg.classSize)||25);n++){const el=document.getElementById('n-'+n);if(el&&el.value.trim()&&n<=size)names[n]=el.value.trim()}
  await store.update('config',{names,classSize:size});T.cfg.names=names;T.cfg.classSize=size;renderSettings();flash('n-msg','저장했어요');
}
async function addOff(){const d=document.getElementById('o-date').value;if(!d)return;await setOff(d,true);T.cfg.offDates[d]=true;renderSettings()}
async function savePin(){const v=document.getElementById('p-new').value.trim();if(v.length<4){flash('p-msg','4자리 이상으로 정해 주세요');return}await store.set('config/pin',v);flash('p-msg','바꿨어요')}

/* =========================================================
   6) 교실 TV
   ========================================================= */
const V={cfg:null,today:{}};
function startTV(){
  store.watch('config',c=>{V.cfg=mergeConfig(c);renderTV()});
  store.watch('records/'+dateStr(),r=>{V.today=r||{};renderTV()});
  setInterval(renderTV,20000);
}
function renderTV(){
  if(!V.cfg) return;
  const size=Number(V.cfg.classSize)||25, w=currentWindow(V.cfg);
  const card=b=>{const d=countDone(V.today,b);const pct=Math.round(d/size*100);
    return `<div class="tv-card ${w&&w.block===b?'now':''}"><div class="l">${BLOCK_NAME[b]} 체크${w&&w.block===b?' · 지금':''}</div>
      <div class="v">${d}<small> / ${size}</small></div><div class="bar"><i style="width:${pct}%"></i></div></div>`};
  const r=(V.cfg.rules||[]).filter(Boolean);
  $app.innerHTML=`<div class="tv"><div class="tv-head"><h1>우리반 습관 체크</h1><div class="tv-clock">${niceDate(dateStr())} ${hm()}</div></div>
    <div class="tv-cards">${card('morning')}${card('lunch')}</div>
    ${r.length?`<div class="tv-rules"><h2>꼭 지키는 약속</h2><ul>${r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>`;
}

/* =========================================================
   7) 앱 설치 (홈 화면 아이콘, 주소창 없이 열기)
   ========================================================= */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(MODE==='student'&&S.cfg)renderStudent()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(MODE==='student'&&S.cfg)renderStudent()});
function installBtn(){return (installEvt&&!isStandalone())?`<button class="install" onclick="doInstall()">📲 이 태블릿에 앱으로 설치</button>`:''}
async function doInstall(){if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;renderStudent()}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));
}

/* =========================================================
   8) 시작
   ========================================================= */
(async function(){
  await initStore();
  const c=await store.get('config');
  if(!c) await store.set('config',DEFAULT_CONFIG);
  if(MODE==='teacher') startTeacher();
  else if(MODE==='tv') startTV();
  else startStudent();
})();
</script>
</body>
